services:
  db:
    image: postgres:16
    container_name: data_pipeline_db
    restart: unless-stopped
    environment:
      # Значения подставляются из файла .env
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Порт на компьютере : порт внутри контейнера
      - "${DB_PORT}:5432"
    volumes:
      # Данные базы сохраняются между перезапусками контейнера
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: